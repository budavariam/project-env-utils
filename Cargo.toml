[workspace]
resolver = "2"

[package]
name = "project-env-utils"
version = "0.2.1"
edition = "2024"

[lib]
name = "penv"
path = "src/lib.rs"

[[bin]]
name = "penv"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
similar = { version = "2", features = ["text"] }
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"

[dev-dependencies]
tempfile = "3"
